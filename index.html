<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photosynthesis Quiz</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9fafc;
    color: #222;
    margin: 20px;
  }
  .start-screen, .end-screen {
    text-align: center;
    margin-top: 50px;
    transition: opacity 0.7s ease;
  }
  .end-screen { display: none; opacity: 0; }
  
  .progress {
    text-align: center;
    font-weight: bold;
    margin-bottom: 15px;
    display: none;
  }
  
  #quiz-container {
    position: relative;
    max-width: 700px;
    margin: 0 auto;
    min-height: 400px; 
  }
  
  .quiz-box {
    position: absolute;
    top: 0; left: 0; width: 100%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease; /* Question Fade */
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    padding: 25px;
    box-sizing: border-box;
  }
  
  .quiz-box.active {
    opacity: 1;
    pointer-events: auto;
  }

  .question { font-weight: bold; margin-bottom: 12px; }
  
  /* Tightened vertical space for answers */
  label { 
    display: block; 
    margin: 4px 0; /* Reduced from 10px to 4px */
    cursor: pointer; 
    line-height: 1.2;
  }
  
  .tip, .feedback {
    opacity: 0;
    margin-top: 15px;
    padding: 10px;
    border-radius: 4px;
    transition: opacity 0.7s ease; /* Tip/Feedback Fade */
  }
  
  .tip { background: #fff5d6; border-left: 4px solid #ffc107; }
  .tip.visible, .feedback.visible { opacity: 1; }

  .feedback.correct { background: rgba(46,125,50,0.1); border-left: 4px solid #2ecc71; color: #2e7d32; }
  .feedback.incorrect { background: rgba(231,76,60,0.1); border-left: 4px solid #e74c3c; color: #c0392b; }

  button {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .nextBtn { background: #28a745; display: none; }
</style>
</head>
<body>

<div class="start-screen" id="start-screen">
  <h1>Photosynthesis Quiz</h1>
  <p>Welcome! Click Start Quiz to begin.</p>
  <button id="startBtn">Start Quiz</button>
</div>

<div class="progress" id="progress-bar"></div>
<div id="quiz-container"></div>

<div class="end-screen" id="end-screen">
  <h2>Quiz Complete! 🎉</h2>
  <p id="final-score-display" style="font-size: 22px; font-weight: bold;"></p>
  <button id="restartBtn">Restart Quiz</button>
</div>

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  quizQuestions.forEach((q, idx) => {
    const box = document.createElement("div");
    box.className = "quiz-box";
    box.innerHTML = `
      <div class="question">${idx+1}. ${q.question}</div>
      ${Object.entries(q.answers).map(([key,val])=>`<label><input type="radio" name="q${idx}" value="${key}"> ${val}</label>`).join('')}
      <div class="tip">${q.tip}</div>
      <div class="feedback"></div>
      <button class="submitBtn">Submit</button>
      <button class="nextBtn">Next</button>
    `;
    container.appendChild(box);
  });
  setupEventListeners();
}

function startTipTimer(box) {
  const tip = box.querySelector('.tip');
  tip.classList.remove('visible');
  currentTimer = setTimeout(() => tip.classList.add('visible'), tip_delay_ms);
}

function updateProgress(idx) {
  document.getElementById('progress-bar').textContent = `Question ${idx + 1} of ${quizQuestions.length} | Score: ${score}`;
}

function setupEventListeners() {
  document.querySelectorAll('.quiz-box').forEach((box, idx, all) => {
    const submitBtn = box.querySelector('.submitBtn');
    const nextBtn = box.querySelector('.nextBtn');
    const feedback = box.querySelector('.feedback');
    const q = quizQuestions[idx];

    submitBtn.addEventListener('click', () => {
      const selected = box.querySelector('input[type="radio"]:checked');
      if (!selected) return alert('Please select an answer.');

      clearTimeout(currentTimer);
      box.querySelector('.tip').classList.remove('visible');
      box.querySelectorAll('input').forEach(i => i.disabled = true);
      submitBtn.disabled = true;

      feedback.textContent = q.feedbacks[selected.value] || (selected.value === q.correct ? "Correct!" : "Incorrect.");
      if (selected.value === q.correct) {
        score++;
        feedback.classList.add('correct');
      } else {
        feedback.classList.add('incorrect');
      }

      void feedback.offsetWidth; 
      feedback.classList.add('visible');
      updateProgress(idx);
      nextBtn.style.display = 'inline-block';
    });

    nextBtn.addEventListener('click', () => {
      box.style.opacity = 0; 
      setTimeout(() => {
        box.classList.remove('active');
        const nextBox = all[idx + 1];
        if (nextBox) {
          nextBox.classList.add('active');
          void nextBox.offsetWidth;
          nextBox.style.opacity = 1; 
          startTipTimer(nextBox);
          updateProgress(idx + 1);
        } else {
          showEndScreen();
        }
      }, 700); 
    });
  });
}

function showEndScreen() {
  const end = document.getElementById('end-screen');
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('final-score-display').textContent = `Your final score: ${score} out of ${quizQuestions.length}`;
  end.style.display = 'block';
  setTimeout(() => end.style.opacity = 1, 50);
}

document.getElementById('startBtn').addEventListener('click', () => {
  const start = document.getElementById('start-screen');
  start.style.opacity = 0;
  setTimeout(() => {
    start.style.display = 'none';
    document.getElementById('progress-bar').style.display = 'block';
    buildQuiz();
    const firstBox = document.querySelector('.quiz-box');
    firstBox.classList.add('active');
    void firstBox.offsetWidth;
    firstBox.style.opacity = 1;
    startTipTimer(firstBox);
    updateProgress(0);
  }, 700);
});

document.getElementById('restartBtn').addEventListener('click', () => {
  location.reload();
});

buildQuiz();
</script>
</body>
</html>
